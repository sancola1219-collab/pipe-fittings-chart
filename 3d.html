<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管件查詢圖鑑 3D</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 3D 頁專用 */
  #stage{width:100%; height:100%; display:block; touch-action:none;}
</style>
</head>
<body>
<header>
  <div>
    <h1>管件查詢圖鑑 3D</h1>
    <div class="sub">PIPE FITTINGS 3D VIEWER</div>
  </div>
  <div id="sizeBar"></div>
  <button class="toolBtn" id="btnTable">管徑對照表</button>
  <button class="toolBtn" id="btnSpin">🔄 自動旋轉</button>
  <button class="toolBtn" id="btnReset">⤢ 回全景</button>
  <a class="toolBtn" href="index.html">📐 2D 圖鑑</a>
</header>
<div id="main">
  <div id="canvasWrap">
    <canvas id="stage"></canvas>
    <div id="hint">單指/左鍵拖曳＝旋轉｜雙指/滾輪＝縮放｜點管件看說明｜雙擊聚焦</div>
  </div>
  <aside id="panel"></aside>
</div>
<div id="modal">
  <div id="modalBox">
    <button class="toolBtn close" onclick="document.getElementById('modal').classList.remove('show')">✕ 關閉</button>
    <h2>管徑對照表（CNS 6445 / JIS G3452 SGP 配管用碳鋼鋼管）</h2>
    <div id="pipeTable"></div>
    <p class="note" style="max-width:720px">
      台灣水電俗稱「幾分」：1 分 = 1/8"，4 分 = 1/2"，6 分 = 3/4"，8 分即 1 吋。
    </p>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   3D 檢視 —— 15 個管件模型排成 5×3 展示台，OrbitControls 旋轉縮放
   （資料 SIZES / FITTINGS / panelHTML 在 data.js，與 2D 共用）
═══════════════════════════════════════════════════════════════ */
let selSize = SIZES.find(s=>s.key==='2');
let selFit  = 'elbow90';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f6f8);
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 300);
camera.position.set(0, 18, 34);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 90;
controls.minDistance = 3;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(12, 24, 14);
scene.add(sun);

/* ── 材質（每次呼叫都給新實例，避免共用材質互相干擾） ── */
const matSteel = () => new THREE.MeshStandardMaterial({color:0xb9c6d2, metalness:.62, roughness:.4});
const matBody  = () => new THREE.MeshStandardMaterial({color:0x9db0c0, metalness:.55, roughness:.5});
const matDarkM = () => new THREE.MeshStandardMaterial({color:0x2f3d4a, metalness:.3, roughness:.7});

/* ── 幾何小工具 ── */
const Y = new THREE.Vector3(0,1,0), Z = new THREE.Vector3(0,0,1);
function tube(p1, p2, r, mat){          // 兩點之間的圓管
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const dir = new THREE.Vector3().subVectors(b,a), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,24), mat||matSteel());
  m.position.copy(a).addScaledVector(dir,.5);
  m.quaternion.setFromUnitVectors(Y, dir.normalize());
  return m;
}
function hexX(r, h, x){                 // 軸向 X 的六角
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,6), matBody());
  m.rotation.z = Math.PI/2; m.position.x = x;
  return m;
}
function ringsX(x1, x2, r, y=0){        // 沿 X 軸的一排螺紋環
  const g = new THREE.Group(), n = 5;
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, .045, 8, 28), matBody());
    m.rotation.y = Math.PI/2;
    m.position.set(x1 + (x2-x1)*i/(n-1), y, 0);
    g.add(m);
  }
  return g;
}
function arcPipe(R, r, arc){            // XY 平面圓弧管（彎頭本體）
  return new THREE.Mesh(new THREE.TorusGeometry(R, r, 20, 32, arc), matSteel());
}

/* ── 各管件 3D 模型（單位約 ±2 的盒子內） ── */
const BUILD3D = {
  elbow90(){
    const g = new THREE.Group();
    g.add(arcPipe(1.3,.55,Math.PI/2));
    g.add(tube([1.3,0,0],[1.3,-1.1,0],.55));
    g.add(tube([0,1.3,0],[-1.1,1.3,0],.55));
    g.position.set(-0.1,-0.5,0);
    return g;
  },
  elbow45(){
    const g = new THREE.Group();
    g.add(arcPipe(1.3,.55,Math.PI/4));
    g.add(tube([1.3,0,0],[1.3,-1.3,0],.55));
    const c=Math.cos(Math.PI/4), s=Math.sin(Math.PI/4);
    g.add(tube([1.3*c,1.3*s,0],[1.3*c-1.3*s*0.92, 1.3*s+1.3*c*0.92, 0],.55));
    g.rotation.z = Math.PI/8; g.position.y = -0.6;
    return g;
  },
  tee(){
    const g = new THREE.Group();
    g.add(tube([-1.7,0,0],[1.7,0,0],.55));
    g.add(tube([0,0,0],[0,1.5,0],.55));
    g.position.y = -0.3;
    return g;
  },
  rtee(){
    const g = new THREE.Group();
    g.add(tube([-1.7,0,0],[1.7,0,0],.55));
    g.add(tube([0,0,0],[0,1.5,0],.34));
    g.position.y = -0.3;
    return g;
  },
  creducer(){
    const g = new THREE.Group();
    g.add(tube([-1.7,0,0],[-0.68,0,0],.6));
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(.36,.6,1.4,24), matSteel());
    cone.rotation.z = -Math.PI/2;
    g.add(cone);
    g.add(tube([0.68,0,0],[1.7,0,0],.36));
    return g;
  },
  ereducer(){
    const g = new THREE.Group();
    g.add(tube([-1.7,0,0],[-0.68,0,0],.6));
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(.36,.6,1.4,24), matSteel());
    cone.rotation.z = -Math.PI/2 + Math.atan2(.24,1.4);
    cone.position.y = -0.12;
    g.add(cone);
    const st = tube([0.68,-0.24,0],[1.7,-0.24,0],.36);
    g.add(st);
    return g;
  },
  cap(){
    const g = new THREE.Group();
    g.add(tube([-1.2,0,0],[0.25,0,0],.6));
    const dome = new THREE.Mesh(new THREE.SphereGeometry(.6,24,14,0,Math.PI*2,0,Math.PI/2), matSteel());
    dome.rotation.z = -Math.PI/2; dome.position.x = 0.25;
    g.add(dome);
    return g;
  },
  union(){
    const g = new THREE.Group();
    g.add(tube([-1.9,0,0],[-1.0,0,0],.45));
    g.add(tube([-1.05,0,0],[-0.34,0,0],.62,matBody()));
    g.add(hexX(.9,.62,0));
    g.add(tube([0.34,0,0],[1.05,0,0],.62,matBody()));
    g.add(tube([1.0,0,0],[1.9,0,0],.45));
    return g;
  },
  coupling(){
    const g = new THREE.Group();
    g.add(tube([-1.8,0,0],[-0.85,0,0],.5));
    g.add(tube([-0.9,0,0],[0.9,0,0],.72,matBody()));
    [-0.82,0.82].forEach(x=>{
      const rim = new THREE.Mesh(new THREE.TorusGeometry(.72,.06,10,30), matBody());
      rim.rotation.y = Math.PI/2; rim.position.x = x;
      g.add(rim);
    });
    g.add(tube([0.85,0,0],[1.8,0,0],.5));
    return g;
  },
  nipple(){
    const g = new THREE.Group();
    g.add(tube([-1.4,0,0],[1.4,0,0],.5));
    g.add(ringsX(-1.32,-0.78,.52));
    g.add(ringsX(0.78,1.32,.52));
    return g;
  },
  bushing(){
    const g = new THREE.Group();
    g.add(tube([-0.95,0,0],[-0.26,0,0],.75,matBody()));
    g.add(ringsX(-0.88,-0.36,.77));
    g.add(hexX(.95,.55,0));
    g.add(tube([0.26,0,0],[0.9,0,0],.4));
    return g;
  },
  plug(){
    const g = new THREE.Group();
    g.add(hexX(.8,.5,-0.55));
    const shank = new THREE.Mesh(new THREE.CylinderGeometry(.5,.57,1.1,24), matSteel());
    shank.rotation.z = -Math.PI/2; shank.position.x = 0.25;
    g.add(shank);
    g.add(ringsX(-0.1,0.65,.56));
    return g;
  },
  flange(){
    const g = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.34,40), matSteel());
    disc.rotation.z = Math.PI/2;
    g.add(disc);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.78,.78,.5,28), matSteel());
    hub.rotation.z = Math.PI/2; hub.position.x = .4;
    g.add(hub);
    g.add(tube([0.6,0,0],[1.7,0,0],.55));
    const bore = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.4,24), matDarkM());
    bore.rotation.z = Math.PI/2; bore.position.x = -0.05;
    g.add(bore);
    for(let i=0;i<4;i++){
      const a = Math.PI/4 + i*Math.PI/2;
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.42,16), matDarkM());
      bolt.rotation.z = Math.PI/2;
      bolt.position.set(0, 1.1*Math.sin(a), 1.1*Math.cos(a));
      g.add(bolt);
    }
    return g;
  },
  cross(){
    const g = new THREE.Group();
    g.add(tube([-1.7,0,0],[1.7,0,0],.55));
    g.add(tube([0,-1.5,0],[0,1.5,0],.55));
    return g;
  },
  stelbow(){
    const g = new THREE.Group();
    g.add(arcPipe(1.3,.55,Math.PI/2));
    g.add(tube([1.3,0,0],[1.3,-1.1,0],.55));
    for(let i=0;i<5;i++){           // 外牙端的牙環（垂直軸，手動放）
      const m = new THREE.Mesh(new THREE.TorusGeometry(.57,.045,8,28), matBody());
      m.rotation.x = Math.PI/2;
      m.position.set(1.3, -0.6 - i*0.12, 0);
      g.add(m);
    }
    g.add(tube([0,1.3,0],[-1.1,1.3,0],.62,matBody()));
    g.position.set(-0.1,-0.5,0);
    return g;
  },
};

/* ── 文字標籤（Sprite，永遠面向鏡頭） ── */
function makeLabel(line1, line2){
  const c = document.createElement('canvas');
  c.width = 720; c.height = 210;
  const x = c.getContext('2d');
  x.textAlign = 'center';
  x.fillStyle = '#2c3e50';
  x.font = 'bold 58px "Microsoft JhengHei", sans-serif';
  x.fillText(line1, 360, 78);
  x.fillStyle = '#c0392b';
  x.font = 'bold 50px "Microsoft JhengHei", sans-serif';
  x.fillText(line2, 360, 165);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.renderOrder = 999;            // 標籤永遠可讀，不被座台/模型遮住
  spr.scale.set(7.2, 2.1, 1);
  return spr;
}
function dimText(f){
  const i = SIZES.indexOf(selSize);
  const vals = f.dimGet(selSize, i);
  if(!vals) return '此口徑無對焊標準值';
  return f.dimCols.map((c,j)=>{
    const v = vals[j];
    return (typeof v === 'string') ? v : `${c.split(' ')[0]}=${v}`;
  }).join('　') + '（mm）';
}

/* ── 展示台組裝：5×3 ── */
const COLS3 = 5, SPACE = 8.2;
const groups = [];      // {fit, root, pedestal, label}
FITTINGS.forEach((f,i)=>{
  const root = new THREE.Group();
  root.position.set((i%COLS3-2)*SPACE, 0, (Math.floor(i/COLS3)-1)*SPACE);
  const model = BUILD3D[f.id]();
  model.scale.setScalar(1.35);
  root.add(model);
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(3.0,3.2,.22,44),
    new THREE.MeshStandardMaterial({color:0xe2e8ee, metalness:.1, roughness:.85}));
  ped.position.y = -2.55;
  root.add(ped);
  const label = makeLabel(f.name, dimText(f));
  label.position.y = -3.6;
  root.add(label);
  root.traverse(o=>{ o.userData.fid = f.id; });
  scene.add(root);
  groups.push({fit:f, root, ped, label});
});

/* ── 口徑切換：重做標籤文字＋說明欄 ── */
function refreshLabels(){
  groups.forEach(g=>{
    const spr = makeLabel(g.fit.name, dimText(g.fit));
    spr.position.copy(g.label.position);
    g.root.remove(g.label);
    g.label.material.map.dispose(); g.label.material.dispose();
    g.root.add(spr);
    g.label = spr;
    spr.userData.fid = g.fit.id;
  });
}
function refreshSelection(){
  groups.forEach(g=>{
    g.ped.material.color.set(g.fit.id===selFit ? 0xffd966 : 0xe2e8ee);
  });
}
function renderPanel(){
  const f = FITTINGS.find(x=>x.id===selFit);
  document.getElementById('panel').innerHTML = panelHTML(f, selSize);
}

/* ── 點選（區分旋轉拖曳與點擊） ── */
const ray = new THREE.Raycaster();
let downPos = null;
canvas.addEventListener('pointerdown', e=>{ downPos = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if(moved > 6) return;              // 是拖曳不是點擊
  const r = canvas.getBoundingClientRect();
  const p = new THREE.Vector2(
    (e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(p, camera);
  const hits = ray.intersectObjects(scene.children, true);
  const hit = hits.find(h=>h.object.userData.fid);
  if(hit){ selFit = hit.object.userData.fid; refreshSelection(); renderPanel(); }
});
canvas.addEventListener('dblclick', e=>{
  const g = groups.find(x=>x.fit.id===selFit);
  if(!g) return;
  controls.target.copy(g.root.position);
  const dir = new THREE.Vector3(0,3.2,7.5);
  camera.position.copy(g.root.position).add(dir);
});
document.getElementById('btnReset').onclick = ()=>{
  controls.target.set(0,0,0);
  camera.position.set(0,18,34);
};
document.getElementById('btnSpin').onclick = function(){
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.2;
  this.style.borderColor = controls.autoRotate ? 'var(--accent)' : '';
  this.style.color = controls.autoRotate ? 'var(--accent)' : '';
};

/* ── 口徑列／對照表（與 2D 相同） ── */
function renderSizeBar(){
  const bar = document.getElementById('sizeBar');
  bar.innerHTML = '';
  SIZES.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.fen;
    b.title = `${s.b}／${s.a}`;
    b.className = s.key===selSize.key ? 'on' : '';
    b.onclick = ()=>{ selSize=s; renderSizeBar(); refreshLabels(); renderPanel(); };
    bar.appendChild(b);
  });
}
document.getElementById('btnTable').onclick = ()=>{
  const rows = SIZES.map(s=>`<tr>
    <td>${s.fen}</td><td>${s.b}</td><td>${s.a}</td><td>DN${s.a.replace('A','')}</td>
    <td>${s.od}</td><td>${s.t}</td><td>${s.kg}</td><td>${s.aod}</td></tr>`).join('');
  document.getElementById('pipeTable').innerHTML = `<table>
    <tr><th>台制俗稱</th><th>英吋 (B)</th><th>JIS/CNS (A)</th><th>DN</th>
        <th>SGP 外徑 mm</th><th>SGP 厚度 mm</th><th>重量 kg/m</th><th>ASME 外徑 mm</th></tr>
    ${rows}</table>`;
  document.getElementById('modal').classList.add('show');
};

/* ── 渲染迴圈 ── */
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(canvas.width!==Math.floor(w*renderer.getPixelRatio()) || canvas.height!==Math.floor(h*renderer.getPixelRatio())){
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
}
function loop(){
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
renderSizeBar();
refreshSelection();
renderPanel();
loop();
</script>
</body>
</html>
