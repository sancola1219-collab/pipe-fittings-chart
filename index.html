<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管件查詢圖鑑</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 2D 圖鑑頁專用 */
  #chart{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  #chart.panning{cursor:grabbing;}
  #zoomCtl{
    position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px;
  }
  #zoomCtl button{
    width:36px; height:36px; border-radius:8px; border:1px solid #c7d0d9;
    background:#fff; font-size:17px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>管件查詢圖鑑</h1>
    <div class="sub">PIPE FITTINGS REFERENCE CHART</div>
  </div>
  <div id="sizeBar"></div>
  <input id="search" placeholder="搜尋：彎頭 / 由令 / tee…">
  <button class="toolBtn" id="btnTable">管徑對照表</button>
  <a class="toolBtn" href="3d.html">🧊 3D 檢視</a>
</header>
<div id="main">
  <div id="canvasWrap">
    <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="zoomCtl">
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="縮小">－</button>
      <button id="zfit" title="全覽">⤢</button>
    </div>
    <div id="hint">滾輪縮放｜拖曳平移｜點管件看說明｜雙擊聚焦</div>
  </div>
  <aside id="panel"></aside>
</div>
<div id="modal">
  <div id="modalBox">
    <button class="toolBtn close" onclick="document.getElementById('modal').classList.remove('show')">✕ 關閉</button>
    <h2>管徑對照表（CNS 6445 / JIS G3452 SGP 配管用碳鋼鋼管）</h2>
    <div id="pipeTable"></div>
    <p class="note" style="max-width:720px">
      台灣水電俗稱「幾分」：1 分 = 1/8"，4 分 = 1/2"，6 分 = 3/4"，8 分即 1 吋。<br>
      SGP（CNS 6445 / JIS G3452）為台灣一般配管（水、氣體、消防）最常用鋼管；ASME B36.10 外徑為美規對焊管件搭配尺寸，兩者小口徑外徑略有不同，叫料時需注意系統別。
    </p>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   繪圖區 —— SVG 圖鑑牆：5 欄 × 3 列格子，每格一個管件＋尺寸標註
   （資料 SIZES / FITTINGS / panelHTML 在 data.js，2D/3D 共用）
═══════════════════════════════════════════════════════════════ */
const CELL_W=380, CELL_H=360, COLS=5, MX=40, MY=90;
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
let selSize = SIZES.find(s=>s.key==='2');   // 預設 2 吋
let selFit  = 'elbow90';
let queryStr = '';

function el(tag, attrs={}, parent){
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, str, attrs={}){
  const t = el('text', Object.assign({x, y, 'font-size':14, fill:'var(--ink)'}, attrs), parent);
  t.textContent = str;
  return t;
}
/* 管身：同一路徑畫兩次（深色粗＋淺色細）呈現有輪廓的管子 */
function pipe(parent, d, w=42){
  el('path',{d, fill:'none', stroke:'#3b5468','stroke-width':w+6,'stroke-linejoin':'round'},parent);
  el('path',{d, fill:'none', stroke:'#cfe0ef','stroke-width':w,'stroke-linejoin':'round'},parent);
}
/* 實心輪廓件（大小頭、管帽等） */
function solid(parent, d){
  el('path',{d, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3,'stroke-linejoin':'round'},parent);
}
/* 螺紋斜線 */
function threads(parent, x, y, w, h){
  const g = el('g',{stroke:'#3b5468','stroke-width':1.4},parent);
  for(let i=0;i<w;i+=6) el('line',{x1:x+i, y1:y, x2:x+i-4, y2:y+h},g);
}
/* 尺寸線（含箭頭與文字） */
function dimH(parent, x1, x2, y, label){
  const g = el('g',{stroke:'var(--dim)','stroke-width':1.3},parent);
  el('line',{x1, y1:y, x2, y2:y, 'marker-start':'url(#ar)','marker-end':'url(#ar)'},g);
  el('line',{x1, y1:y-6, x2:x1, y2:y+6},g);
  el('line',{x1:x2, y1:y-6, x2:x2, y2:y+6},g);
  txt(parent,(x1+x2)/2, y-7, label, {fill:'var(--dim)','text-anchor':'middle','font-size':15,'font-weight':'bold'});
}
function dimV(parent, x, y1, y2, label){
  const g = el('g',{stroke:'var(--dim)','stroke-width':1.3},parent);
  el('line',{x1:x, y1, x2:x, y2, 'marker-start':'url(#ar)','marker-end':'url(#ar)'},g);
  el('line',{x1:x-6, y1, x2:x+6, y2:y1},g);
  el('line',{x1:x-6, y1:y2, x2:x+6, y2:y2},g);
  txt(parent, x-9, (y1+y2)/2, label, {fill:'var(--dim)','text-anchor':'middle','font-size':15,'font-weight':'bold',
      transform:`rotate(-90 ${x-9} ${(y1+y2)/2})`});
}

/* ── 各管件畫法（格子區域約 380×300，下方留名稱列） ── */
const DRAW = {
  elbow90(g,s){
    const A = s.bw ? s.bw[BW.ELBOW90] : null;
    pipe(g,'M130,50 L130,160 A60,60 0 0 0 190,220 L320,220');
    el('line',{x1:108,y1:50,x2:152,y2:50, stroke:'#3b5468','stroke-width':3},g);
    el('line',{x1:320,y1:198,x2:320,y2:242, stroke:'#3b5468','stroke-width':3},g);
    dimV(g,70,50,220,`A=${fmt(A)}`);
    dimH(g,130,320,275,`A=${fmt(A)}`);
    txt(g,235,105,`Ø${s.aod}`,{fill:'#607488','font-size':13});
  },
  elbow45(g,s){
    const B = s.bw ? s.bw[BW.ELBOW45] : null;
    pipe(g,'M60,225 L185,225 L280,130');
    dimH(g,60,185,278,`B=${fmt(B)}`);
    el('path',{d:'M245,225 A60,60 0 0 0 227,183', fill:'none', stroke:'#607488','stroke-width':1.3},g);
    txt(g,262,205,'45°',{fill:'#607488','font-size':13});
  },
  tee(g,s){
    const C = s.bw ? s.bw[BW.TEE] : null;
    pipe(g,'M60,210 L320,210'); pipe(g,'M190,210 L190,70');
    dimH(g,190,320,265,`C=${fmt(C)}`);
    dimV(g,120,70,210,`M=${fmt(C)}`);
  },
  rtee(g,s){
    const C = s.bw ? s.bw[BW.TEE] : null;
    pipe(g,'M60,215 L320,215'); pipe(g,'M190,215 L190,85',30);
    dimH(g,190,320,270,`C=${fmt(C)}`);
    txt(g,215,105,'支管縮徑',{fill:'#607488','font-size':13});
  },
  creducer(g,s){
    const H = s.bw ? s.bw[BW.REDUCER] : null;
    solid(g,'M85,130 L150,130 L235,165 L295,165 L295,235 L235,235 L150,270 L85,270 Z');
    el('line',{x1:85,y1:200,x2:295,y2:200, stroke:'#8aa0b5','stroke-width':1,'stroke-dasharray':'6 4'},g);
    dimH(g,85,295,305,`H=${fmt(H)}`);
    dimV(g,55,130,270,`ØD=${s.aod}`);
  },
  ereducer(g,s){
    const H = s.bw ? s.bw[BW.REDUCER] : null;
    solid(g,'M85,140 L150,140 L235,185 L295,185 L295,255 L85,255 Z');
    el('line',{x1:70,y1:255,x2:310,y2:255, stroke:'#8aa0b5','stroke-width':1,'stroke-dasharray':'6 4'},g);
    txt(g,240,275,'管底齊平',{fill:'#607488','font-size':12});
    dimH(g,85,295,305,`H=${fmt(H)}`);
    dimV(g,55,140,255,`ØD=${s.aod}`);
  },
  cap(g,s){
    const E = s.bw ? s.bw[BW.CAP] : null;
    solid(g,'M120,140 L215,140 A62,62 0 0 1 215,260 L120,260 Z');
    el('line',{x1:120,y1:152,x2:212,y2:152, stroke:'#8aa0b5','stroke-width':1.2},g);
    el('line',{x1:120,y1:248,x2:212,y2:248, stroke:'#8aa0b5','stroke-width':1.2},g);
    dimH(g,120,277,300,`E=${fmt(E)}`);
    dimV(g,90,140,260,`ØD=${s.aod}`);
  },
  union(g,s){
    pipe(g,'M55,200 L110,200',36);
    el('rect',{x:110,y:168,width:52,height:64, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    el('rect',{x:162,y:156,width:58,height:88, fill:'#b9cfe3', stroke:'#3b5468','stroke-width':3},g);
    el('line',{x1:162,y1:185,x2:220,y2:185, stroke:'#3b5468','stroke-width':1.4},g);
    el('line',{x1:162,y1:215,x2:220,y2:215, stroke:'#3b5468','stroke-width':1.4},g);
    el('rect',{x:220,y:168,width:52,height:64, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    pipe(g,'M272,200 L327,200',36);
    txt(g,191,140,'活動螺帽',{fill:'#607488','font-size':13,'text-anchor':'middle'});
    el('line',{x1:191,y1:148,x2:191,y2:160, stroke:'#607488','stroke-width':1.2},g);
    dimH(g,110,272,282,`PT ${s.b}`);
  },
  coupling(g,s){
    pipe(g,'M60,200 L130,200',34);
    el('rect',{x:130,y:162,width:120,height:76, rx:8, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    threads(g,140,170,25,60); threads(g,215,170,25,60);
    pipe(g,'M250,200 L320,200',34);
    dimH(g,130,250,282,`PT ${s.b}×2`);
    txt(g,190,150,'內牙×內牙',{fill:'#607488','font-size':13,'text-anchor':'middle'});
  },
  nipple(g,s){
    el('rect',{x:95,y:178,width:190,height:44, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    threads(g,98,180,48,40); threads(g,232,180,48,40);
    dimH(g,95,285,262,'L 依需求叫料');
    dimV(g,65,178,222,`ØD=${s.od}`);
    txt(g,190,155,'兩端外牙',{fill:'#607488','font-size':13,'text-anchor':'middle'});
  },
  bushing(g,s){
    el('rect',{x:105,y:165,width:80,height:70, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    threads(g,108,168,74,64);
    el('rect',{x:185,y:150,width:40,height:100, fill:'#b9cfe3', stroke:'#3b5468','stroke-width':3},g);
    el('rect',{x:225,y:180,width:55,height:40, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    dimV(g,75,165,235,`外牙 R ${s.b}`);
    txt(g,255,165,'內牙縮小',{fill:'#607488','font-size':13});
    txt(g,205,135,'六角',{fill:'#607488','font-size':13,'text-anchor':'middle'});
  },
  plug(g,s){
    el('rect',{x:120,y:158,width:48,height:84, fill:'#b9cfe3', stroke:'#3b5468','stroke-width':3},g);
    el('line',{x1:120,y1:186,x2:168,y2:186, stroke:'#3b5468','stroke-width':1.4},g);
    el('line',{x1:120,y1:214,x2:168,y2:214, stroke:'#3b5468','stroke-width':1.4},g);
    el('path',{d:'M168,172 L255,178 L255,222 L168,228 Z', fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    threads(g,172,176,80,48);
    dimH(g,168,255,275,`R ${s.b}`);
    txt(g,144,140,'六角頭',{fill:'#607488','font-size':13,'text-anchor':'middle'});
  },
  flange(g,s){
    el('circle',{cx:150,cy:195,r:78, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    el('circle',{cx:150,cy:195,r:56, fill:'none', stroke:'#8aa0b5','stroke-width':1,'stroke-dasharray':'5 4'},g);
    el('circle',{cx:150,cy:195,r:30, fill:'#fff', stroke:'#3b5468','stroke-width':2.5},g);
    for(let i=0;i<4;i++){
      const a = Math.PI/4 + i*Math.PI/2;
      el('circle',{cx:150+56*Math.cos(a), cy:195+56*Math.sin(a), r:8, fill:'#fff', stroke:'#3b5468','stroke-width':2},g);
    }
    el('rect',{x:265,y:117,width:22,height:156, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    el('rect',{x:287,y:165,width:34,height:60, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    txt(g,150,300,'PCD 依 10K / Class150 查表',{fill:'#607488','font-size':13,'text-anchor':'middle'});
    dimV(g,52,117,273,`Ø孔=${s.od}`);
  },
  cross(g,s){
    const C = s.bw ? s.bw[BW.TEE] : null;
    pipe(g,'M60,195 L320,195'); pipe(g,'M190,65 L190,325');
    dimH(g,190,320,255,`C=${fmt(C)}`);
    dimV(g,120,65,195,`C=${fmt(C)}`);
  },
  stelbow(g,s){
    pipe(g,'M130,60 L130,160 A60,60 0 0 0 190,220 L275,220');
    el('rect',{x:275,y:196,width:50,height:48, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3},g);
    threads(g,279,199,42,42);
    txt(g,300,180,'外牙 R',{fill:'#607488','font-size':13,'text-anchor':'middle'});
    txt(g,130,45,'內牙 Rp',{fill:'#607488','font-size':13,'text-anchor':'middle'});
    dimH(g,130,325,278,`R×Rp ${s.b}`);
  },
};

/* ── 圖鑑牆組裝 ── */
function renderChart(){
  svg.innerHTML = '';
  const defs = el('defs',{},svg);
  const mk = el('marker',{id:'ar', viewBox:'0 0 10 10', refX:5, refY:5,
    markerWidth:7, markerHeight:7, orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 Z', fill:'var(--dim)'},mk);

  const rows = Math.ceil(FITTINGS.length/COLS);
  const W = MX*2 + COLS*CELL_W, H = MY + rows*CELL_H + 40;
  svg.dataset.w = W; svg.dataset.h = H;

  // 標題列（工程圖框風）
  el('rect',{x:8,y:8,width:W-16,height:H-16, fill:'none', stroke:'#3b5468','stroke-width':2.5},svg);
  txt(svg, MX, 52, '管件查詢圖鑑　PIPE FITTINGS CHART', {'font-size':30,'font-weight':'bold','letter-spacing':'2'});
  txt(svg, W-MX, 44, `目前口徑：${selSize.fen}（${selSize.b}／${selSize.a}）`, {'font-size':20,'text-anchor':'end', fill:'var(--accent)','font-weight':'bold'});
  txt(svg, W-MX, 68, `SGP 外徑 Ø${selSize.od}×t${selSize.t}　ASME 外徑 Ø${selSize.aod}　尺寸單位 mm`, {'font-size':14,'text-anchor':'end', fill:'#607488'});

  FITTINGS.forEach((f,i)=>{
    const cx = MX + (i%COLS)*CELL_W, cy = MY + Math.floor(i/COLS)*CELL_H;
    const g = el('g',{transform:`translate(${cx},${cy})`, 'data-id':f.id, cursor:'pointer'},svg);
    const hit = queryStr && (f.name+f.en+f.alias.join('')).toLowerCase().includes(queryStr);
    const dimmed = queryStr && !hit;
    if(dimmed) g.setAttribute('opacity','0.18');
    el('rect',{x:6,y:6,width:CELL_W-12,height:CELL_H-12, rx:10,
      fill: f.id===selFit ? '#fffbe8' : '#ffffff',
      stroke: f.id===selFit ? '#e0a800' : (hit ? 'var(--accent)' : '#d4dce4'),
      'stroke-width': f.id===selFit||hit ? 3 : 1.5},g);
    DRAW[f.id](g, selSize);
    txt(g, CELL_W/2, CELL_H-22, `${f.name}｜${f.en}`,
      {'text-anchor':'middle','font-size':17,'font-weight':'bold'});
    g.addEventListener('click', ()=>{ selFit=f.id; renderChart(); renderPanel(); });
    g.addEventListener('dblclick', ()=>zoomToCell(cx,cy));
  });
  applyView();
}

/* ── 縮放平移（近遠看） ── */
let view = null; // {x,y,w,h}
function fitView(){
  const W=+svg.dataset.w, H=+svg.dataset.h;
  view = {x:0, y:0, w:W, h:H};
  applyView();
}
function applyView(){
  if(!view) fitView(); else
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function zoomAt(px, py, factor){   // px,py：SVG 座標
  const nw = Math.min(8000, Math.max(150, view.w*factor));
  const k = nw/view.w;
  view.x = px - (px-view.x)*k;
  view.y = py - (py-view.y)*k;
  view.w = nw; view.h *= k;
  applyView();
}
function clientToSvg(e){
  const r = svg.getBoundingClientRect();
  return { x: view.x + (e.clientX-r.left)/r.width*view.w,
           y: view.y + (e.clientY-r.top)/r.height*view.h };
}
function zoomToCell(cx,cy){
  const r = svg.getBoundingClientRect(), asp = r.width/r.height;
  let w = CELL_W*1.25, h = w/asp;
  if(h < CELL_H*1.15){ h = CELL_H*1.15; w = h*asp; }
  view = {x:cx-(w-CELL_W)/2, y:cy-(h-CELL_H)/2, w, h};
  applyView();
}
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = clientToSvg(e);
  zoomAt(p.x, p.y, e.deltaY>0 ? 1.18 : 1/1.18);
},{passive:false});
let panStart = null;
svg.addEventListener('pointerdown', e=>{
  panStart = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
  svg.classList.add('panning'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e=>{
  if(!panStart) return;
  const r = svg.getBoundingClientRect();
  view.x = panStart.vx - (e.clientX-panStart.x)/r.width*view.w;
  view.y = panStart.vy - (e.clientY-panStart.y)/r.height*view.h;
  applyView();
});
svg.addEventListener('pointerup', ()=>{ panStart=null; svg.classList.remove('panning'); });
document.getElementById('zin').onclick = ()=>zoomAt(view.x+view.w/2, view.y+view.h/2, 1/1.3);
document.getElementById('zout').onclick = ()=>zoomAt(view.x+view.w/2, view.y+view.h/2, 1.3);
document.getElementById('zfit').onclick = fitView;

/* ── 右側說明欄（模板在 data.js 的 panelHTML） ── */
function renderPanel(){
  const f = FITTINGS.find(x=>x.id===selFit);
  document.getElementById('panel').innerHTML = panelHTML(f, selSize);
}

/* ── 口徑切換列 ── */
function renderSizeBar(){
  const bar = document.getElementById('sizeBar');
  bar.innerHTML = '';
  SIZES.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.fen;
    b.title = `${s.b}／${s.a}`;
    b.className = s.key===selSize.key ? 'on' : '';
    b.onclick = ()=>{ selSize=s; renderSizeBar(); renderChart(); renderPanel(); };
    bar.appendChild(b);
  });
}

/* ── 搜尋 ── */
document.getElementById('search').addEventListener('input', e=>{
  queryStr = e.target.value.trim().toLowerCase();
  renderChart();
});

/* ── 管徑對照表 ── */
document.getElementById('btnTable').onclick = ()=>{
  const rows = SIZES.map(s=>`<tr>
    <td>${s.fen}</td><td>${s.b}</td><td>${s.a}</td><td>DN${s.a.replace('A','')}</td>
    <td>${s.od}</td><td>${s.t}</td><td>${s.kg}</td><td>${s.aod}</td></tr>`).join('');
  document.getElementById('pipeTable').innerHTML = `<table>
    <tr><th>台制俗稱</th><th>英吋 (B)</th><th>JIS/CNS (A)</th><th>DN</th>
        <th>SGP 外徑 mm</th><th>SGP 厚度 mm</th><th>重量 kg/m</th><th>ASME 外徑 mm</th></tr>
    ${rows}</table>`;
  document.getElementById('modal').classList.add('show');
};

/* ── 啟動 ── */
renderSizeBar();
renderChart();
fitView();
renderPanel();
window.addEventListener('resize', applyView);
</script>
</body>
</html>
