<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管件查詢圖鑑</title>
<style>
  :root{
    --ink:#2c3e50; --pipe-dark:#3b5468; --pipe-light:#cfe0ef;
    --dim:#c0392b; --accent:#1f6feb; --bg:#f4f6f8; --card:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 14px; background:#fff; border-bottom:2px solid #dde3e9; z-index:5;
  }
  header h1{font-size:18px; letter-spacing:2px; white-space:nowrap;}
  header .sub{font-size:11px; color:#8a97a5; letter-spacing:1px;}
  #sizeBar{display:flex; gap:4px; flex-wrap:wrap;}
  #sizeBar button{
    border:1px solid #c7d0d9; background:#fff; border-radius:6px;
    padding:4px 9px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  #sizeBar button:hover{border-color:var(--accent);}
  #sizeBar button.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold;}
  #search{
    border:1px solid #c7d0d9; border-radius:6px; padding:5px 10px;
    font-size:13px; width:150px; font-family:inherit;
  }
  .toolBtn{
    border:1px solid #c7d0d9; background:#fff; border-radius:6px;
    padding:5px 10px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .toolBtn:hover{border-color:var(--accent); color:var(--accent);}
  #main{flex:1; display:flex; min-height:0;}
  #canvasWrap{flex:1; position:relative; min-width:0;}
  #chart{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  #chart.panning{cursor:grabbing;}
  #zoomCtl{
    position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px;
  }
  #zoomCtl button{
    width:36px; height:36px; border-radius:8px; border:1px solid #c7d0d9;
    background:#fff; font-size:17px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  #hint{
    position:absolute; left:14px; bottom:14px; font-size:11px; color:#8a97a5;
    background:rgba(255,255,255,.85); padding:4px 8px; border-radius:6px;
  }
  /* ── 右側說明欄 ─────────────────────────── */
  #panel{
    width:340px; background:var(--card); border-left:2px solid #dde3e9;
    overflow-y:auto; padding:14px; flex-shrink:0;
  }
  #panel h2{font-size:19px; margin-bottom:2px;}
  #panel .en{color:#8a97a5; font-size:12px; margin-bottom:10px; letter-spacing:.5px;}
  .infoRow{margin-bottom:10px; font-size:13px; line-height:1.6;}
  .infoRow b{
    display:inline-block; background:#eef3f8; color:#40576d; border-radius:4px;
    padding:0 6px; margin-right:6px; font-size:12px;
  }
  .tag{
    display:inline-block; background:#e8f1fd; color:#1f5fc9; border-radius:10px;
    padding:1px 9px; font-size:12px; margin:2px 3px 2px 0;
  }
  #panel table{
    width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;
  }
  #panel th,#panel td{
    border:1px solid #dde3e9; padding:3px 5px; text-align:center; white-space:nowrap;
  }
  #panel th{background:#eef3f8; font-weight:600;}
  #panel tr.hl td{background:#fff3d6; font-weight:bold;}
  .note{font-size:11px; color:#9aa6b2; margin-top:8px; line-height:1.5;}
  /* ── 對照表彈窗 ─────────────────────────── */
  #modal{
    position:fixed; inset:0; background:rgba(30,40,50,.45); display:none;
    align-items:center; justify-content:center; z-index:20;
  }
  #modal.show{display:flex;}
  #modalBox{
    background:#fff; border-radius:12px; padding:20px; max-width:92vw;
    max-height:88vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  #modalBox h2{font-size:17px; margin-bottom:10px;}
  #modalBox table{border-collapse:collapse; font-size:13px;}
  #modalBox th,#modalBox td{border:1px solid #cfd8e0; padding:5px 10px; text-align:center; white-space:nowrap;}
  #modalBox th{background:#eef3f8;}
  #modalBox tr:nth-child(even) td{background:#f8fafc;}
  #modalBox .close{float:right;}
  @media (max-width:800px){
    #panel{position:absolute; right:0; top:0; bottom:0; box-shadow:-4px 0 12px rgba(0,0,0,.15);}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>管件查詢圖鑑</h1>
    <div class="sub">PIPE FITTINGS REFERENCE CHART</div>
  </div>
  <div id="sizeBar"></div>
  <input id="search" placeholder="搜尋：彎頭 / 由令 / tee…">
  <button class="toolBtn" id="btnTable">管徑對照表</button>
</header>
<div id="main">
  <div id="canvasWrap">
    <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="zoomCtl">
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="縮小">－</button>
      <button id="zfit" title="全覽">⤢</button>
    </div>
    <div id="hint">滾輪縮放｜拖曳平移｜點管件看說明｜雙擊聚焦</div>
  </div>
  <aside id="panel"></aside>
</div>
<div id="modal">
  <div id="modalBox">
    <button class="toolBtn close" onclick="document.getElementById('modal').classList.remove('show')">✕ 關閉</button>
    <h2>管徑對照表（CNS 6445 / JIS G3452 SGP 配管用碳鋼鋼管）</h2>
    <div id="pipeTable"></div>
    <p class="note" style="max-width:720px">
      台灣水電俗稱「幾分」：1 分 = 1/8"，4 分 = 1/2"，6 分 = 3/4"，8 分即 1 吋。<br>
      SGP（CNS 6445 / JIS G3452）為台灣一般配管（水、氣體、消防）最常用鋼管；ASME B36.10 外徑為美規對焊管件搭配尺寸，兩者小口徑外徑略有不同，叫料時需注意系統別。
    </p>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   資料區 —— 全部尺寸均查證於 2026-07-10，來源見 docs/DATA-SOURCES.md
   ─ SGP 鋼管：JIS G3452 Table 5（= CNS 6445）
   ─ 對焊管件：ASME B16.9（1/2"~6"，小於 1/2" 無對焊標準 → null）
═══════════════════════════════════════════════════════════════ */
const SIZES = [
  // key, A稱呼, B稱呼, 台制, SGP外徑, SGP厚, 重量kg/m, ASME外徑, B16.9:[90°A, 45°B, 三通C, 大小頭H, 管帽E]
  {key:'1/8',  a:'6A',   b:'1/8"',   fen:'1分',   od:10.5,  t:2.0, kg:0.419, aod:10.3,  bw:null},
  {key:'1/4',  a:'8A',   b:'1/4"',   fen:'2分',   od:13.8,  t:2.3, kg:0.664, aod:13.7,  bw:null},
  {key:'3/8',  a:'10A',  b:'3/8"',   fen:'3分',   od:17.3,  t:2.3, kg:0.866, aod:17.1,  bw:null},
  {key:'1/2',  a:'15A',  b:'1/2"',   fen:'4分',   od:21.7,  t:2.8, kg:1.25,  aod:21.3,  bw:[38,16,25,38,25]},
  {key:'3/4',  a:'20A',  b:'3/4"',   fen:'6分',   od:27.2,  t:2.8, kg:1.60,  aod:26.7,  bw:[38,19,29,38,25]},
  {key:'1',    a:'25A',  b:'1"',     fen:'1吋',   od:34.0,  t:3.2, kg:2.45,  aod:33.4,  bw:[38,22,38,51,38]},
  {key:'1-1/4',a:'32A',  b:'1-1/4"', fen:'1吋2',  od:42.7,  t:3.5, kg:3.16,  aod:42.2,  bw:[48,25,48,51,38]},
  {key:'1-1/2',a:'40A',  b:'1-1/2"', fen:'1吋半', od:48.6,  t:3.5, kg:3.63,  aod:48.3,  bw:[57,29,57,64,38]},
  {key:'2',    a:'50A',  b:'2"',     fen:'2吋',   od:60.5,  t:3.8, kg:5.12,  aod:60.3,  bw:[76,35,64,76,38]},
  {key:'2-1/2',a:'65A',  b:'2-1/2"', fen:'2吋半', od:76.3,  t:4.2, kg:6.34,  aod:73.0,  bw:[95,44,76,89,38]},
  {key:'3',    a:'80A',  b:'3"',     fen:'3吋',   od:89.1,  t:4.2, kg:8.49,  aod:88.9,  bw:[114,51,86,89,51]},
  {key:'4',    a:'100A', b:'4"',     fen:'4吋',   od:114.3, t:4.5, kg:12.2,  aod:114.3, bw:[152,64,105,102,64]},
  {key:'5',    a:'125A', b:'5"',     fen:'5吋',   od:139.8, t:4.5, kg:16.1,  aod:141.3, bw:[190,79,124,127,76]},
  {key:'6',    a:'150A', b:'6"',     fen:'6吋',   od:165.2, t:5.0, kg:19.2,  aod:168.3, bw:[229,95,143,140,89]},
];
const BW = {ELBOW90:0, ELBOW45:1, TEE:2, REDUCER:3, CAP:4};

const MAT = {
  malleable:'瑪鋼（可鍛鑄鐵，鍍鋅／黑），牙口 CNS 2472／ASME B16.3',
  carbon:'碳鋼 A234 WPB（對焊，ASME B16.9）',
  ss:'不鏽鋼 SUS304／SUS316（對焊、牙口、壓接都有）',
  pvc:'PVC（CNS 4053，南亞等，給水／排水用）',
  brass:'青銅／黃銅（水表週邊、熱水系統）',
  press:'不鏽鋼壓接式（Press fit，自來水常用）',
};

/* 每個管件：id、名稱、英文、一般叫法（俗稱）、用途、材質、標準、
   尺寸表定義（cols＋每個 size 的取值函式），draw() 畫圖 */
const FITTINGS = [
  {
    id:'elbow90', name:'90°彎頭', en:'90° Elbow (Long Radius)',
    alias:['90度L','彎頭','エルボ（台語：L仔）'],
    usage:'改變管路方向 90°。長半徑（LR）彎曲半徑＝1.5 倍口徑，阻力小，是配管最常用的方向轉換管件。',

    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',
    dimCols:['A 中心至端面'],
    dimGet:s=>s.bw?[s.bw[BW.ELBOW90]]:null,
    note:'A＝中心至端面距離（mm）。牙口彎頭尺寸依各廠牌型錄，此表為對焊 LR 彎頭。',
  },
  {
    id:'elbow45', name:'45°彎頭', en:'45° Elbow',
    alias:['45度L','斜彎'],
    usage:'改變管路方向 45°。兩支 45° 可取代一支 90° 減少壓損；排水配管閃避樑柱常用。',
    mats:[MAT.carbon, MAT.ss, MAT.malleable, MAT.pvc],
    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',
    dimCols:['B 中心至端面'],
    dimGet:s=>s.bw?[s.bw[BW.ELBOW45]]:null,
    note:'B＝中心至端面距離（mm），對焊 LR 45° 彎頭。',
  },
  {
    id:'tee', name:'三通（正三通）', en:'Equal Tee',
    alias:['T仔','正T','チーズ'],
    usage:'管路分歧出一支垂直支管，三口同徑。給水分歧、消防立管分層最常用。',

    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',

    dimGet:s=>s.bw?[s.bw[BW.TEE], s.bw[BW.TEE]]:null,

  {

    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',
    dimCols:['C 中心至管端（同正三通）'],
    dimGet:s=>s.bw?[s.bw[BW.TEE]]:null,
    note:'主管 C 與正三通相同；支管 M 依「主×主×支」組合而異，叫料須講三個口徑，詳廠商型錄。',
  },
  {
    id:'creducer', name:'同心大小頭', en:'Concentric Reducer',
    alias:['大小頭','R','異徑管','レジューサ'],
    usage:'兩端不同口徑、中心線對齊。立管變徑、泵浦出口變徑用。',
    mats:[MAT.carbon, MAT.ss, MAT.pvc],
    std:'對焊：ASME B16.9',
    dimCols:['H 全長'],
    dimGet:s=>s.bw?[s.bw[BW.REDUCER]]:null,
    note:'H＝端面至端面全長（mm），依「大端」口徑查表。牙口變徑用補芯（bushing）或異徑束節。',
  },
  {
    id:'ereducer', name:'偏心大小頭', en:'Eccentric Reducer',
    alias:['偏心R','ER'],
    usage:'兩端不同口徑、一側管壁齊平。水平管線變徑保持管底（或管頂）水平，泵浦吸入端防積氣必用。',
    mats:[MAT.carbon, MAT.ss],
    std:'對焊：ASME B16.9',
    dimCols:['H 全長（同同心）'],
    dimGet:s=>s.bw?[s.bw[BW.REDUCER]]:null,
    note:'H 與同心大小頭相同。安裝方向：吸入端平頂（防氣袋）、蒸汽管平底（防水鎚）。',
  },
  {
    id:'cap', name:'管帽', en:'Cap',
    alias:['CAP','封頭','管尾蓋'],
    usage:'封閉管末端。對焊蓋為橢圓形封頭；牙口內牙蓋直接鎖在管牙上。',
    mats:[MAT.carbon, MAT.ss, MAT.malleable, MAT.pvc],
    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',
    dimCols:['E 全長'],
    dimGet:s=>s.bw?[s.bw[BW.CAP]]:null,
    note:'E＝端面至頂點長（mm），對焊管帽。',
  },
  {
    id:'union', name:'由令', en:'Union',
    alias:['由任','活接頭','ユニオン'],
    usage:'可拆式接頭：中間螺帽鬆開即可分離管路，不必轉動管子。設備（泵、熱水器、水表）前後必裝，方便日後維修拆換。',
    mats:[MAT.malleable, MAT.ss, MAT.brass, MAT.pvc],
    std:'牙口：CNS 2472 / ASME B16.39（クラス150）',
    dimCols:['牙規 PT'],
    dimGet:s=>[`PT ${s.b}`],
    note:'全長依廠牌（無統一標準值）。密合面有平面／錐面／O 環三種，舊管換修要對型式。',
  },
  {
    id:'coupling', name:'束節（管接頭）', en:'Coupling / Socket',
    alias:['S接','束尼','直接頭','ソケット'],

    std:'牙口：CNS 2472 / ASME B16.3',
    dimCols:['牙規 PT'],
    dimGet:s=>[`PT ${s.b}`],

  },
  {

    mats:[MAT.malleable, MAT.ss, MAT.brass],
    std:'CNS 4165 / JIS B2302，管體用 SGP 管',
    dimCols:['外徑 ØD（SGP）'],
    dimGet:s=>[s.od],
    note:'全長 L 叫料時指定（例：4分×100mm 長）。全牙短節俗稱「全牙」。',

    alias:['布信','大小補芯','ブッシング'],
    usage:'外牙大×內牙小的縮徑件，直接鎖進大管件內牙把口徑縮小，例：1" 三通支口縮成 4 分接感知器。',
    mats:[MAT.malleable, MAT.ss, MAT.brass],
    std:'牙口：CNS 2472 / ASME B16.14',
    dimCols:['外牙 R','內牙 Rp（縮一級示例）'],
    dimGet:(s,i)=>[`R ${s.b}`, i>0?`Rp ${SIZES[i-1].b}`:'—'],
    note:'叫料講「大×小」兩口徑，例：6分×4分補芯。',
  },
  {
    id:'plug', name:'管塞', en:'Plug',
    alias:['不拉古','堵頭','塞頭','プラグ'],
    usage:'外牙塞頭，鎖進內牙管口封閉，如三通預留口、排水頭。頭部有四角／六角／內六角。',
    mats:[MAT.malleable, MAT.ss, MAT.brass, MAT.pvc],
    std:'牙口：CNS 2472 / ASME B16.14',
    dimCols:['牙規 R'],
    dimGet:s=>[`R ${s.b}`],
    note:'與管帽相反：管塞是外牙塞「進去」，管帽是內牙蓋「上去」。',
  },
  {
    id:'flange', name:'法蘭', en:'Flange',
    alias:['凸緣','法蘭盤','フランジ'],
    usage:'管端焊上（或牙上）法蘭盤，兩盤夾墊片鎖螺栓成可拆接頭。閥類、設備接口、大口徑管路標配。',
    mats:[MAT.carbon, MAT.ss],
    std:'JIS B2220（10K，台灣最常用）／ASME B16.5（Class 150）',
    dimCols:['配管外徑 ØD（SGP）'],
    dimGet:s=>[s.od],
    note:'法蘭外徑、螺栓孔數與 PCD 依壓力等級（10K／Class150）不同，叫料要先講等級，再查該等級尺寸表。型式有滑入焊（SO）、對焊頸（WN）、牙口、盲板（BL）。',
  },
  {
    id:'cross', name:'四通', en:'Cross',
    alias:['十字','四路'],
    usage:'四口同徑十字分歧。消防、灑水系統較常見；一般給水多用兩個三通取代。',
    mats:[MAT.carbon, MAT.ss, MAT.malleable],
    std:'對焊：ASME B16.9｜牙口：CNS 2472 / ASME B16.3',
    dimCols:['C 中心至端面（同三通）'],
    dimGet:s=>s.bw?[s.bw[BW.TEE]]:null,
    note:'對焊四通 C 尺寸與正三通相同。',
  },
  {
    id:'stelbow', name:'內外彎（街彎）', en:'Street Elbow',
    alias:['內外牙彎頭','公母彎'],
    usage:'一端外牙、一端內牙的 90° 彎頭，可直接鎖進另一管件省一支短節，狹小空間轉向好用。',
    mats:[MAT.malleable, MAT.ss, MAT.brass, MAT.pvc],
    std:'牙口：CNS 2472 / ASME B16.3',
    dimCols:['牙規 R×Rp'],
    dimGet:s=>[`R×Rp ${s.b}`],
    note:'也有 45° 內外彎。長度依廠牌。',
  },
];

/* ═══════════════════════════════════════════════════════════════
   繪圖區 —— SVG 圖鑑牆：5 欄 × 3 列格子，每格一個管件＋尺寸標註
═══════════════════════════════════════════════════════════════ */
const CELL_W=380, CELL_H=360, COLS=5, MX=40, MY=90;
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
let selSize = SIZES.find(s=>s.key==='2');   // 預設 2 吋
let selFit  = 'elbow90';
let queryStr = '';

function el(tag, attrs={}, parent){
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, str, attrs={}){
  const t = el('text', Object.assign({x, y, 'font-size':14, fill:'var(--ink)'}, attrs), parent);
  t.textContent = str;
  return t;
}
/* 管身：同一路徑畫兩次（深色粗＋淺色細）呈現有輪廓的管子 */
function pipe(parent, d, w=42){
  el('path',{d, fill:'none', stroke:'#3b5468','stroke-width':w+6,'stroke-linejoin':'round'},parent);
  el('path',{d, fill:'none', stroke:'#cfe0ef','stroke-width':w,'stroke-linejoin':'round'},parent);
}
/* 實心輪廓件（大小頭、管帽等） */
function solid(parent, d){
  el('path',{d, fill:'#cfe0ef', stroke:'#3b5468','stroke-width':3,'stroke-linejoin':'round'},parent);
}
/* 螺紋斜線 */
function threads(parent, x, y, w, h){
  const g = el('g',{stroke:'#3b5468','stroke-width':1.4},parent);
  for(let i=0;i<w;i+=6) el('line',{x1:x+i, y1:y, x2:x+i-4, y2:y+h},g);
}
/* 尺寸線（含箭頭與文字） */
function dimH(parent, x1, x2, y, label){
  const g = el('g',{stroke:'var(--dim)','stroke-width':1.3},parent);
  el('line',{x1, y1:y, x2, y2:y, 'marker-start':'url(#ar)','marker-end':'url(#ar)'},g);
  el('line',{x1, y1:y-6, x2:x1, y2:y+6},g);
  el('line',{x1:x2, y1:y-6, x2:x2, y2:y+6},g);
  txt(parent,(x1+x2)/2, y-7, label, {fill:'var(--dim)','text-anchor':'middle','font-size':15,'font-weight':'bold'});
}
function dimV(parent, x, y1, y2, label){
  const g = el('g',{stroke:'var(--dim)','stroke-width':1.3},parent);
  el('line',{x1:x, y1, x2:x, y2, 'marker-start':'url(#ar)','marker-end':'url(#ar)'},g);
  el('line',{x1:x-6, y1, x2:x+6, y2:y1},g);
  el('line',{x1:x-6, y1:y2, x2:x+6, y2:y2},g);
  txt(parent, x-9, (y1+y2)/2, label, {fill:'var(--dim)','text-anchor':'middle','font-size':15,'font-weight':'bold',
      transform:`rotate(-90 ${x-9} ${(y1+y2)/2})`});
}
const fmt = v => v==null ? '—' : (typeof v==='number'? v+'' : v);

/* ── 圖鑑牆組裝 ── */
function renderChart(){
  svg.innerHTML = '';
  const defs = el('defs',{},svg);
  const mk = el('marker',{id:'ar', viewBox:'0 0 10 10', refX:5, refY:5,
    markerWidth:7, markerHeight:7, orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 Z', fill:'var(--dim)'},mk);

  const rows = Math.ceil(FITTINGS.length/COLS);
  const W = MX*2 + COLS*CELL_W, H = MY + rows*CELL_H + 40;
  svg.dataset.w = W; svg.dataset.h = H;

  // 標題列（工程圖框風）
  el('rect',{x:8,y:8,width:W-16,height:H-16, fill:'none', stroke:'#3b5468','stroke-width':2.5},svg);
  txt(svg, MX, 52, '管件查詢圖鑑　PIPE FITTINGS CHART', {'font-size':30,'font-weight':'bold','letter-spacing':'2'});
  txt(svg, W-MX, 44, `目前口徑：${selSize.fen}（${selSize.b}／${selSize.a}）`, {'font-size':20,'text-anchor':'end', fill:'var(--accent)','font-weight':'bold'});
  txt(svg, W-MX, 68, `SGP 外徑 Ø${selSize.od}×t${selSize.t}　ASME 外徑 Ø${selSize.aod}　尺寸單位 mm`, {'font-size':14,'text-anchor':'end', fill:'#607488'});

  FITTINGS.forEach((f,i)=>{
    const cx = MX + (i%COLS)*CELL_W, cy = MY + Math.floor(i/COLS)*CELL_H;
    const g = el('g',{transform:`translate(${cx},${cy})`, 'data-id':f.id, cursor:'pointer'},svg);
    const hit = queryStr && (f.name+f.en+f.alias.join('')).toLowerCase().includes(queryStr);
    const dimmed = queryStr && !hit;
    if(dimmed) g.setAttribute('opacity','0.18');
    el('rect',{x:6,y:6,width:CELL_W-12,height:CELL_H-12, rx:10,
      fill: f.id===selFit ? '#fffbe8' : '#ffffff',
      stroke: f.id===selFit ? '#e0a800' : (hit ? 'var(--accent)' : '#d4dce4'),
      'stroke-width': f.id===selFit||hit ? 3 : 1.5},g);
    DRAW[f.id](g, selSize);
    txt(g, CELL_W/2, CELL_H-22, `${f.name}｜${f.en}`,
      {'text-anchor':'middle','font-size':17,'font-weight':'bold'});
    g.addEventListener('click', ()=>{ selFit=f.id; renderChart(); renderPanel(); });
    g.addEventListener('dblclick', ()=>zoomToCell(cx,cy));
  });
  applyView();
}

/* ── 縮放平移（近遠看） ── */
let view = null; // {x,y,w,h}
function fitView(){
  const W=+svg.dataset.w, H=+svg.dataset.h;
  view = {x:0, y:0, w:W, h:H};
  applyView();
}
function applyView(){
  if(!view) fitView(); else
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function zoomAt(px, py, factor){   // px,py：SVG 座標
  const nw = Math.min(8000, Math.max(150, view.w*factor));
  const k = nw/view.w;
  view.x = px - (px-view.x)*k;
  view.y = py - (py-view.y)*k;
  view.w = nw; view.h *= k;
  applyView();
}
function clientToSvg(e){
  const r = svg.getBoundingClientRect();
  return { x: view.x + (e.clientX-r.left)/r.width*view.w,
           y: view.y + (e.clientY-r.top)/r.height*view.h };
}
function zoomToCell(cx,cy){
  const r = svg.getBoundingClientRect(), asp = r.width/r.height;
  let w = CELL_W*1.25, h = w/asp;
  if(h < CELL_H*1.15){ h = CELL_H*1.15; w = h*asp; }
  view = {x:cx-(w-CELL_W)/2, y:cy-(h-CELL_H)/2, w, h};
  applyView();
}
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = clientToSvg(e);
  zoomAt(p.x, p.y, e.deltaY>0 ? 1.18 : 1/1.18);
},{passive:false});
let panStart = null;
svg.addEventListener('pointerdown', e=>{
  panStart = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
  svg.classList.add('panning'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e=>{
  if(!panStart) return;
  const r = svg.getBoundingClientRect();
  view.x = panStart.vx - (e.clientX-panStart.x)/r.width*view.w;
  view.y = panStart.vy - (e.clientY-panStart.y)/r.height*view.h;
  applyView();
});
svg.addEventListener('pointerup', ()=>{ panStart=null; svg.classList.remove('panning'); });
document.getElementById('zin').onclick = ()=>zoomAt(view.x+view.w/2, view.y+view.h/2, 1/1.3);
document.getElementById('zout').onclick = ()=>zoomAt(view.x+view.w/2, view.y+view.h/2, 1.3);
document.getElementById('zfit').onclick = fitView;

/* ── 右側說明欄 ── */
function renderPanel(){
  const f = FITTINGS.find(x=>x.id===selFit);
  const p = document.getElementById('panel');
  const rows = SIZES.map((s,i)=>{
    const vals = f.dimGet(s,i);
    const cells = f.dimCols.map((_,j)=>`<td>${vals?fmt(vals[j]):'—'}</td>`).join('');
    return `<tr class="${s.key===selSize.key?'hl':''}">
      <td>${s.fen}</td><td>${s.b}</td><td>${s.a}</td><td>${s.od}</td>${cells}</tr>`;
  }).join('');
  p.innerHTML = `
    <h2>${f.name}</h2>
    <div class="en">${f.en}</div>
    <div class="infoRow"><b>一般叫法</b>${f.alias.map(a=>`<span class="tag">${a}</span>`).join('')}</div>
    <div class="infoRow"><b>用途</b>${f.usage}</div>
    <div class="infoRow"><b>常見材質</b><br>${f.mats.map(m=>`・${m}`).join('<br>')}</div>
    <div class="infoRow"><b>規範</b>${f.std}</div>
    <table>
      <tr><th>台制</th><th>吋</th><th>A</th><th>SGP外徑</th>${f.dimCols.map(c=>`<th>${c}</th>`).join('')}</tr>
      ${rows}
    </table>
    <p class="note">${f.note}</p>
    <p class="note">「—」＝該口徑無此標準值（ASME B16.9 對焊管件自 1/2" 起）。資料查證日 2026-07-10，來源見 docs/DATA-SOURCES.md。</p>`;
}

/* ── 口徑切換列 ── */
function renderSizeBar(){
  const bar = document.getElementById('sizeBar');
  bar.innerHTML = '';
  SIZES.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.fen;
    b.title = `${s.b}／${s.a}`;
    b.className = s.key===selSize.key ? 'on' : '';
    b.onclick = ()=>{ selSize=s; renderSizeBar(); renderChart(); renderPanel(); };
    bar.appendChild(b);
  });
}

/* ── 搜尋 ── */
document.getElementById('search').addEventListener('input', e=>{
  queryStr = e.target.value.trim().toLowerCase();
  renderChart();
});

/* ── 管徑對照表 ── */
document.getElementById('btnTable').onclick = ()=>{
  const rows = SIZES.map(s=>`<tr>
    <td>${s.fen}</td><td>${s.b}</td><td>${s.a}</td><td>DN${s.a.replace('A','')}</td>
    <td>${s.od}</td><td>${s.t}</td><td>${s.kg}</td><td>${s.aod}</td></tr>`).join('');
  document.getElementById('pipeTable').innerHTML = `<table>
    <tr><th>台制俗稱</th><th>英吋 (B)</th><th>JIS/CNS (A)</th><th>DN</th>
        <th>SGP 外徑 mm</th><th>SGP 厚度 mm</th><th>重量 kg/m</th><th>ASME 外徑 mm</th></tr>
    ${rows}</table>`;
  document.getElementById('modal').classList.add('show');
};

/* ── 啟動 ── */
renderSizeBar();
renderChart();
fitView();
renderPanel();
window.addEventListener('resize', applyView);
</script>
